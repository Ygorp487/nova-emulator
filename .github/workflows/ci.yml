name: NOVA CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  windows-build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Validate PowerShell syntax
        shell: pwsh
        run: |
          Get-ChildItem engine/scripts/*.ps1, tools/*.ps1, setup-dev.ps1 | ForEach-Object {
            [void][scriptblock]::Create((Get-Content $_.FullName -Raw))
            Write-Host "Parsed $($_.Name)"
          }

      - name: Install frontend dependencies
        run: npm install

      - name: Build Windows NSIS installer
        run: npm run tauri build -- --bundles nsis

      - name: Upload NOVA Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-Windows-Setup
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
