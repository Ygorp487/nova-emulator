name: Nexo Pages
on:
  push:
    branches: [main]
    paths:
      - 'nexo/**'
      - '.github/workflows/nexo-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: nexo-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Nexo
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./nexo
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
