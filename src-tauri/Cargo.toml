[package]
name = "nova-emulator"
version = "0.1.0"
description = "Lightweight Android emulator launcher for Windows"
authors = ["NOVA Emulator"]
edition = "2021"

[lib]
name = "nova_emulator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
